name: CodeQL güvenlik analizi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Python analizi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: CodeQL'yi başlat
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: Güvenlik analizini çalıştır
        uses: github/codeql-action/analyze@v4
